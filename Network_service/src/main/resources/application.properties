spring.application.name=Network_service
server.port=6060

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:networkdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Service URLs
services.user-service.url=http://localhost:8081
services.wallet-service.url=http://localhost:8084
services.blockchain-service.url=http://localhost:8082
services.governance-service.url=http://localhost:8085
services.api-gateway.url=http://localhost:8080

# Feign Configuration
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=basic

# WebClient Configuration
spring.webflux.base-path=/api

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.Network._service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/network-service.log

# Network Service Configuration
network.heartbeat.interval=30000
network.health-check.interval=60000
network.message.retry.max=3
network.message.timeout=5000

# Security
spring.security.user.name=admin
spring.security.user.password=admin

spring.main.allow-bean-definition-overriding=true